name: Daily Portfolio Report

on:
  schedule:
    # ہر روز ساعت 4:30 PM ET (20:30 UTC) = 00:00 Tehran (فردا)
    - cron: '30 20 * * 1-5'  # Mon-Fri, 4:30 PM ET
  workflow_dispatch:  # Manual trigger

jobs:
  send_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alpaca-trade-api python-telegram-bot requests pandas numpy

    - name: Create config file
      run: |
        cat > config.txt << 'EOF'
        ALPACA_ENDPOINT=${{ secrets.ALPACA_ENDPOINT }}
        ALPACA_KEY=${{ secrets.ALPACA_KEY }}
        ALPACA_SECRET=${{ secrets.ALPACA_SECRET }}
        FINNHUB_KEY=${{ secrets.FINNHUB_KEY }}
        TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
        EOF

    - name: Load latest state
      run: |
        git fetch origin
        git checkout origin/main -- strategy_1h_live_state.json 2>/dev/null || true

    - name: Send Daily Report
      run: python portfolio_report.py

    - name: Save updated state
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add strategy_1h_live_state.json
        git commit -m "Daily report: $(date)" || true
        git push || true
