# قوانین هماهنگ‌کننده‌ی سبد — تقسیم سرمایه، صاحب هر نماد و حدود کل حساب.
# مثل بقیه‌ی قوانین فقط با Pull Request تغییر می‌کند (version+1).
version: 9
approved: '2026-11-13'

sleeves:
  gld_trend:            # ربات روند طلا
    capital_usd: 10000
    symbols: [GLD]
    buys_allowed: true
  qqq_trend:            # هسته‌ی روند QQQ
    capital_usd: 20000
    symbols: [QQQ, IEF]
    buys_allowed: true
  legacy_1h:            # ربات یک‌ساعته — خرید دوباره فعال (۲۰۲۶/۱۰/۳۱) با سقف ۵ هزار دلار (≈۸۰٪ سهام، ≈۲۰٪ اختیار خرید)
    capital_usd: 5000
    symbols: [AMZN, CRGY, KRMN, MU, NVDA, DELL, CVX, HON]
    option_roots: [AMZN, CRGY, KRMN, MU, NVDA, DELL, CVX, HON]
    buys_allowed: true
  copy_trade:           # کپی ترید از تریدرهای بزرگ (قواعد جزئی در rules/copy_trade.yaml)
    capital_usd: 10000
    symbols: ['*']      # هر سهمی که صاحب دیگری ندارد
    buys_allowed: true
  btc_momentum:         # مومنتوم ۲۸ روزه‌ی بیت‌کوین (قواعد در rules/btc_momentum.yaml)
    capital_usd: 5000
    symbols: [BTCUSD, BTC/USD]
    buys_allowed: true
  eth_weekend:          # خرید اتریوم آخر هفته (قواعد در rules/eth_weekend.yaml)
    capital_usd: 5000
    symbols: [ETHUSD, ETH/USD]
    buys_allowed: true
  dbmf_band:             # DBMF (روند آتی‌ها) با باند ±۲٪؛ جایگزین باند SPY (rules/ma_timing.yaml)
    capital_usd: 5000
    symbols: [DBMF]
    buys_allowed: true
  spy_10m:              # میانگین ۱۰ ماهه روی S&P 500؛ معامله روی VOO (rules/ma_timing.yaml)
    capital_usd: 5000
    symbols: [VOO]
    buys_allowed: true
  qqq_200:              # میانگین ۲۰۰ روزه‌ی QQQ؛ معامله روی QQQM (rules/ma_timing.yaml)
    capital_usd: 5000
    symbols: [QQQM]
    buys_allowed: true
  growth_signal:        # خرید سیگنال‌های «احتمال رشد تکنیکال و بنیادی» آمریکا (قواعد در rules/growth_bot.yaml)
    capital_usd: 10000
    symbols: []
    symbols_file: growth/owned.json   # فهرست سهم‌های این ربات (پویا، در datastore)
    buys_allowed: true

account:
  no_margin: true            # نقد بعد از خریدها نباید از reserve_cash_usd کمتر شود
  reserve_cash_usd: 1000
  max_gross_exposure: 1.0    # مجموع ارزش موقعیت‌ها ≤ ۱۰۰٪ ارزش حساب
  sleeve_drift_tolerance: 0.10   # هر ربات تا ۱۰٪ بالاتر از سرمایه‌اش (به‌خاطر رشد قیمت) مجاز است
  drawdown_brake: 0.15       # اگر ارزش حساب ۱۵٪ زیر سقف قبلی‌اش برود …
  brake_scale: 0.5           # … سرمایه‌ی همه‌ی ربات‌ها برای خرید جدید نصف می‌شود
  max_symbol_pct: 0.30       # هیچ نمادی (جمع همه‌ی ربات‌ها) بیش از ۳۰٪ ارزش حساب (ایده از trader-risk)
  blocked_symbols: []        # نمادهای ممنوع برای خرید
  options_blocked: true      # خرید تازه‌ی اختیار معامله ممنوع (قاعده‌ی ربات ساعتی در آزمون رد شد)
  kill_switch: false         # true = هیچ خرید جدیدی در کل حساب
