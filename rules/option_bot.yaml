short_delta_debit: 0.30
credit_take_profit: 0.50    # بستن با ۵۰٪ حداکثر سود
credit_stop_mult: 2.0       # بستن اگر هزینه‌ی بستن ۲ برابر اعتبار شد
debit_take_profit: 0.60
debit_stop: 0.50
