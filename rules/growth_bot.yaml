# قواعد ربات «سیگنال رشد» — سیگنال‌های آمریکای گزارش «احتمال رشد تکنیکال و بنیادی» را می‌خرد.
# فقط با Pull Request تغییر می‌کند (version+1). اعداد خروج هنوز آزمون تاریخی نشده‌اند؛ برای همین فقط حساب آزمایشی.
version: 1
approved: '2026-11-13'
stage: paper
source_url: https://raw.githubusercontent.com/hsalehi10087/stock-scanner/main/data/growth_signal
market: us
capital_usd: 10000            # سقف کل (هماهنگ‌کننده هم همین را در portfolio.yaml چک می‌کند)
trade_usd: 500                # هر سهم ۵٪ سرمایه‌ی ربات
max_positions: 20
signal_max_age_days: 3        # سیگنالی که فایلش بیش از ۳ روز کهنه باشد خریده نمی‌شود
max_chase_pct: 0.05           # اگر قیمت از قیمت سیگنال بیش از ۵٪ بالاتر رفته: نخر
min_price_usd: 5
min_profit_streak: 2          # فقط سیگنالی که سود خالصش دست‌کم ۲ فصل پیاپی بالا رفته (عدد نامعلوم = نخر)
stop_loss_pct: 0.15           # حد ضرر از قیمت خرید
trail_pct: 0.20               # فروش اگر از بالاترین قیمت دیده‌شده بعد از خرید ۲۰٪ پایین بیاید
max_hold_days: 180            # بعد از ۱۸۰ روز فروخته می‌شود (جا برای سیگنال تازه)
rebuy_cooldown_days: 30       # سهمی که فروخته شد تا ۳۰ روز دوباره خریده نمی‌شود
