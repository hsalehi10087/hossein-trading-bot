name: 1-Hour Intraday Strategy

on:
  schedule:
    # ساعات بازار: 9:30 AM - 4:00 PM ET = 14:30-21:00 UTC
    # 14:30 UTC = 18:00 Tehran
    - cron: '30 14,15,16,17,18,19,20,21 * * 1-5'  # Mon-Fri during market hours
  workflow_dispatch:  # Manual trigger

jobs:
  run_strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alpaca-trade-api python-telegram-bot requests pandas numpy

    - name: Create config file
      run: |
        cat > config.txt << 'EOF'
        ALPACA_ENDPOINT=${{ secrets.ALPACA_ENDPOINT }}
        ALPACA_KEY=${{ secrets.ALPACA_KEY }}
        ALPACA_SECRET=${{ secrets.ALPACA_SECRET }}
        FINNHUB_KEY=${{ secrets.FINNHUB_KEY }}
        TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
        EOF

    - name: Run 1H Strategy
      run: python strategy_1h_rest.py

    - name: Upload state file
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: strategy-state
        path: strategy_1h_live_state.json
        retention-days: 30

    - name: Save state to repo
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add strategy_1h_live_state.json
        git commit -m "Update state: $(date)" || true
        git push || true
