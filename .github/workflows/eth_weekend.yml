name: ⟠ ETH weekend drift (paper)

on:
  schedule:
    - cron: '7 */4 * * 6,0'   # شنبه و یکشنبه هر ۴ ساعت: ورود شنبه، حد سود، خروج RSI
    - cron: '7 0,4 * * 1'     # دوشنبه: خروج پایان آخر هفته
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'بدون ثبت سفارش (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pyyaml pytest pandas numpy
      - name: Tests must pass before trading
        run: python -m pytest -q tests
      - run: scripts/datastore.sh pull
      - name: ETH weekend through the conductor
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 eth_weekend.py
      - if: always()
        run: scripts/datastore.sh push "⟠ eth weekend $(date -u +%F_%H%M)"
