name: Strategy 1H

on:
  schedule:
    # GitHub اجرای زمان‌بندی‌شده را گاهی چند ساعت دیر شروع می‌کند؛ پس هر اجرا یک حلقه‌ی طولانی است که
    # خودش تا پایان بازار هر ساعت در دقیقه‌ی ۳۰ کار می‌کند (scripts/hourly_loop.py). دومی اگر اولی تمام شد ادامه می‌دهد.
    - cron: '20 13 * * 1-5'
    - cron: '20 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-1h

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        pip install requests pandas numpy pyyaml
    - name: Load state from data branch
      run: |
        scripts/datastore.sh pull
        cp datastore/strategy_1h/live_state.json strategy_1h_live_state.json 2>/dev/null || echo '{}' > strategy_1h_live_state.json
    - run: python scripts/hourly_loop.py 30 python strategy_1h_rest.py
      env:
        ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
        ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
        ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    - name: Save state
      if: always()
      run: |
        mkdir -p datastore/strategy_1h && cp strategy_1h_live_state.json datastore/strategy_1h/live_state.json
        scripts/datastore.sh push "strategy state $(date -u +%F_%H%M)"
