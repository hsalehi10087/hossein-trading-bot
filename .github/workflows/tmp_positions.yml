name: tmp positions snapshot (read-only)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/datastore.sh pull
      - env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          b = os.environ['ALPACA_ENDPOINT'].rstrip('/')
          b = b if b.endswith('/v2') else b + '/v2'
          h = {'APCA-API-KEY-ID': os.environ['ALPACA_KEY'], 'APCA-API-SECRET-KEY': os.environ['ALPACA_SECRET']}
          pos = requests.get(b + '/positions', headers=h, timeout=20).json()
          od = requests.get(b + '/orders', headers=h, params={'status': 'open'}, timeout=20).json()
          os.makedirs('datastore/account', exist_ok=True)
          json.dump({'positions': [{k: p.get(k) for k in ('symbol', 'qty', 'avg_entry_price', 'market_value', 'unrealized_pl', 'asset_class')} for p in pos],
                     'open_orders': [{k: o.get(k) for k in ('symbol', 'side', 'qty', 'type', 'client_order_id')} for o in od]},
                    open('datastore/account/positions.json', 'w'), indent=1)
          PY
          scripts/datastore.sh push "account snapshot"
