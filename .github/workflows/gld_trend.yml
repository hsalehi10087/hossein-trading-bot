name: 🥇 Gold trend (GLD paper)

on:
  schedule:
    - cron: '30 21 * * 1-5'  # بعد از بسته‌شدن روزانه‌ی طلا؛ سفارش در بازگشایی بعدی آمریکا اجرا می‌شود
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = بدون ثبت سفارش'
        required: false
        default: 'false'

permissions:
  contents: write   # فقط برای push به شاخه‌ی data؛ main فقط با PR تغییر می‌کند

concurrency:
  group: gld_trend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy requests pyyaml pytest
      - name: Tests must pass before trading
        run: python -m pytest -q tests
      - run: scripts/datastore.sh pull
      - name: Run strategy
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 gld_trend.py
      - name: Save audit log to data branch
        if: always()
        run: scripts/datastore.sh push "🥇 gld audit $(date -u +%F)"
