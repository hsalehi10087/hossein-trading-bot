name: 🥇 Gold params review (every 3 weeks)

on:
  schedule:
    - cron: '0 6 * * 6'  # هر شنبه بررسی می‌شود؛ فقط اگر ۲۱ روز از بازبینی قبلی گذشته باشد اجرا می‌شود
  workflow_dispatch:
    inputs:
      force:
        description: 'true = همین حالا بازبینی کن'
        required: false
        default: 'false'

permissions:
  contents: write       # push شاخه‌ی پیشنهاد و شاخه‌ی data
  pull-requests: write  # باز کردن PR پیشنهاد؛ اعمال فقط با merge کاربر

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy requests pyyaml
      - run: scripts/datastore.sh pull
      - name: Review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          git config user.email "action@github.com"; git config user.name "GLD Review Bot"
          python3 gld_review.py
      - name: Save state to data branch
        if: always()
        run: scripts/datastore.sh push "🥇 gld param review $(date -u +%F)"
