name: Daily Portfolio Report

on:
  schedule:
    # ہر روز ساعت 4:30 PM ET (20:30 UTC) = 00:00 Tehran (فردا)
    - cron: '30 20 * * 1-5'  # Mon-Fri, 4:30 PM ET
  workflow_dispatch:  # Manual trigger
    inputs:
      token:
        description: 'توکن ربات (اختیاری؛ خالی = secret)'
        required: false
        default: ''
      chat_id:
        description: 'شناسه چت'
        required: false
        default: '75439320'

permissions:
  contents: write

jobs:
  send_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alpaca-trade-api python-telegram-bot requests pandas numpy

    - name: Mask Telegram token
      env:
        TG_TOKEN: ${{ github.event.inputs.token || secrets.TELEGRAM_BOT_TOKEN }}
      run: echo "::add-mask::$TG_TOKEN"

    - name: Create config file
      run: |
        cat > config.txt << 'EOF'
        ALPACA_ENDPOINT=${{ secrets.ALPACA_ENDPOINT }}
        ALPACA_KEY=${{ secrets.ALPACA_KEY }}
        ALPACA_SECRET=${{ secrets.ALPACA_SECRET }}
        FINNHUB_KEY=${{ secrets.FINNHUB_KEY }}
        TELEGRAM_BOT_TOKEN=${{ github.event.inputs.token || secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID=${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        EOF

    - name: Load latest state (data branch)
      run: |
        scripts/datastore.sh pull
        cp datastore/strategy_1h/live_state.json strategy_1h_live_state.json 2>/dev/null || echo '{}' > strategy_1h_live_state.json

    - name: Send Daily Report
      run: python portfolio_report.py

    - name: Save updated state (data branch)
      if: always()
      run: |
        mkdir -p datastore/strategy_1h && cp strategy_1h_live_state.json datastore/strategy_1h/live_state.json
        scripts/datastore.sh push "Daily report state $(date -u +%F)" || true
