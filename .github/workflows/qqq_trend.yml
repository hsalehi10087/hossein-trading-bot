name: 📈 QQQ trend core (paper)

on:
  schedule:
    - cron: '35 21 * * 1-5'  # بعد از بسته‌شدن بازار آمریکا؛ سفارش در بازگشایی بعدی اجرا می‌شود
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = بدون ثبت سفارش'
        required: false
        default: 'false'
      notify:
        description: 'false = بدون پیام تلگرام'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: qqq_trend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy requests pyyaml pytest
      - name: Tests must pass before trading
        run: python -m pytest -q tests
      - run: scripts/datastore.sh pull
      - name: Run strategy
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.notify == 'false' && 'none' || secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 qqq_trend.py
      - if: always()
        run: scripts/datastore.sh push "📈 qqq audit $(date -u +%F)"
