name: 🧭 Portfolio conductor (nightly, paper)

on:
  schedule:
    - cron: '30 6 * * 2-6'  # ساعت ۱۰:۰۰ صبح تهران (۰۶:۳۰ UTC)، سه‌شنبه تا شنبه = بعد از جلسه‌های دوشنبه تا جمعه؛ سفارش‌ها در بازگشایی همان روز اجرا می‌شوند
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = بدون ثبت سفارش'
        required: false
        default: 'false'
      notify:
        description: 'false = بدون پیام تلگرام'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy requests pyyaml pytest
      - name: Tests must pass before trading
        run: python -m pytest -q tests
      - run: scripts/datastore.sh pull
      - name: Run all strategies through the conductor
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.notify == 'false' && 'none' || secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 run_portfolio.py
      - if: always()
        run: scripts/datastore.sh push "🧭 portfolio $(date -u +%F)"
