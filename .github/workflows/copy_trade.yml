name: 👥 Copy trade (daily, paper)

on:
  schedule:
    - cron: '5 12 * * *'   # هر روز ۱۵:۳۵ تهران (GitHub گاهی چند ساعت دیرتر اجرا می‌کند)؛ روزهای کاری سفارش، تعطیلات فقط گزارش
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'بدون ثبت سفارش (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pyyaml pytest pandas numpy
      - name: Tests must pass before trading
        run: python -m pytest -q tests
      - run: scripts/datastore.sh pull
      - name: Copy trades through the conductor
        env:
          GH_TOKEN: ${{ github.token }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          # اجرای دیرکرده‌ی زمان‌بندی GitHub: اگر امروز اجرای سروقت (dispatch) انجام شده، تکرار نکن
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/copy_trade.yml/runs?event=workflow_dispatch&created=>=$(date -u +%F)&per_page=20" \
                 --jq '[.workflow_runs[]|select(.conclusion=="success" or .status=="in_progress")]|length')
            if [ "$n" -gt 0 ]; then echo "already ran on time today — skip"; exit 0; fi
          fi
          python3 copy_trade.py
      - if: always()
        run: scripts/datastore.sh push "👥 copy trade $(date -u +%F)"
